<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerAdmin webmaster@localhost
    ServerAdmin webmaster@localhost
    ServerName www.lavierlatinfusion.com
    ServerAlias lavierlatinfusion.com
    DocumentRoot /var/www/lavierlatinfusion.com

    <Directory /var/www/lavierlatinfusion.com/>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # ОСНОВНОЙ РЕДИРЕКТ: с HTTPS без www на HTTPS с www И проверка существования пути
    RewriteEngine on
    
    # Если запрос к domain.net (без www) И путь не существует - сразу на главную
    RewriteCond %{HTTP_HOST} !^www\. [NC]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}\.html !-f
    RewriteRule ^(.*)$ https://www.lavierlatinfusion.com/ [R=301,L]
    
    # Если запрос к domain.net (без www) но путь существует - редирект с сохранением пути
    RewriteCond %{HTTP_HOST} !^www\. [NC]
    RewriteRule ^(.*)$ https://www.lavierlatinfusion.com$1 [R=301,L]
    
    # Для запросов УЖЕ к www - проверяем существование пути и редиректим несуществующие на главную
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}\.html !-f
    RewriteRule ^(.*)$ https://www.lavierlatinfusion.com/ [R=301,L]

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/lavierlatinfusion.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lavierlatinfusion.com/privkey.pem
</VirtualHost>
</IfModule>
