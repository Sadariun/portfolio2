<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerAdmin webmaster@localhost
        
        ServerName backnline.com
        ServerAlias www.backnline.com
        
        DocumentRoot /var/www/backnline.com

        <Directory /var/www/backnline.com/>
            Options FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =www.backnline.com [OR]
# RewriteCond %{SERVER_NAME} =backnline.com
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]



Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/backnline.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/backnline.com/privkey.pem
</VirtualHost>
</IfModule>
